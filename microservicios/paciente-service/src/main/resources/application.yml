spring:
  application:
    name: paciente-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
server:
  port: 8081

spring:
  application:
    name: cita-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
server:
  port: 8083
servicios:
  paciente-url: ${PACIENTE_SERVICE_URL:http://localhost:8081}
  medico-url: ${MEDICO_SERVICE_URL:http://localhost:8082}
